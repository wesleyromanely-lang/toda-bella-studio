<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    ADM - Toda Bella Studio
</title>


<style>

*{
    box-sizing:border-box;
}


body{

    font-family:Arial,sans-serif;

    background:#fff5f8;

    margin:0;

    padding:20px;

    color:#444;

}


#painel{

    max-width:1100px;

    margin:auto;

}


.topo{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.topo h1{

    color:#c97b95;

    margin:0;

}


.subtitulo{

    color:#777;

    margin-top:5px;

}


.dashboard{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px,1fr)
        );

    gap:15px;

    margin-bottom:20px;

}


.box{

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

    text-align:center;

}


.box h3{

    color:#c97b95;

    margin-top:0;

}


.box strong{

    font-size:25px;

}


.card{

    background:white;

    padding:20px;

    margin-top:15px;

    border-radius:15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}


.card h2{

    margin-top:0;

    color:#c97b95;

}


.form-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px,1fr)
        );

    gap:15px;

}


label{

    display:block;

    font-weight:bold;

    margin-bottom:5px;

}


input{

    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

}


input:focus{

    outline:none;

    border-color:#c97b95;

}


button{

    padding:12px 18px;

    background:#c97b95;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}


button:hover{

    opacity:.9;

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.btn-salvar{

    width:100%;

    margin-top:15px;

    font-size:16px;

}


.filtro{

    display:grid;

    grid-template-columns:
        250px 150px;

    gap:10px;

    align-items:end;

}


.filtro button{

    height:46px;

}


.resumo-filtro{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}


.resumo-item{

    background:#fff5f8;

    padding:15px;

    border-radius:12px;

    text-align:center;

}


.resumo-item strong{

    display:block;

    color:#c97b95;

    font-size:21px;

    margin-top:5px;

}


#listaRegistros{

    margin-top:20px;

}


.registro{

    display:grid;

    grid-template-columns:
        1fr auto auto;

    gap:15px;

    align-items:center;

    background:#fff8fa;

    padding:15px;

    margin-bottom:10px;

    border-radius:12px;

}


.registro-data{

    display:flex;

    align-items:center;

    gap:12px;

}


.icone-data{

    font-size:25px;

}


.registro-data strong{

    display:block;

}


.registro-data small{

    display:block;

    color:#777;

    margin-top:4px;

}


.registro-valor{

    text-align:right;

}


.registro-valor strong{

    display:block;

    color:#c97b95;

    font-size:18px;

}


.registro-valor small{

    color:#777;

}


.registro-acoes{

    display:flex;

    gap:5px;

}


.registro-acoes button{

    padding:9px 12px;

}


.btn-editar{

    background:#2196f3;

}


.btn-excluir{

    background:#e53935;

}


.carregando{

    padding:25px;

    text-align:center;

}


.vazio{

    text-align:center;

    padding:30px;

    background:#fff5f8;

    border-radius:12px;

}


.icone-vazio{

    font-size:35px;

    margin-bottom:10px;

}


.vazio strong{

    display:block;

}


.vazio p{

    color:#777;

}


.erro-box{

    background:#ffebee;

    color:#c62828;

    padding:20px;

    border-radius:12px;

}


@media(max-width:600px){

    body{

        padding:10px;

    }


    .topo{

        display:block;

        text-align:center;

    }


    .topo h1{

        margin-bottom:5px;

    }


    .filtro{

        grid-template-columns:1fr;

    }


    .filtro button{

        width:100%;

    }


    .resumo-filtro{

        grid-template-columns:1fr;

    }


    .registro{

        grid-template-columns:1fr;

        text-align:center;

    }


    .registro-data{

        justify-content:center;

    }


    .registro-valor{

        text-align:center;

    }


    .registro-acoes{

        justify-content:center;

    }


    .registro-acoes button{

        flex:1;

    }

}

</style>

</head>


<body>


<div id="painel">


    <div class="topo">

        <div>

            <h1>
                🌸 Toda Bella Studio
            </h1>

            <div class="subtitulo">
                Controle financeiro
            </div>

        </div>

    </div>


    <!-- ==================================
         RESUMO
    =================================== -->

    <div class="dashboard">


        <div class="box">

            <h3>
                👩 Pessoas hoje
            </h3>

            <strong id="pessoasHoje">
                0
            </strong>

        </div>


        <div class="box">

            <h3>
                💰 Ganho hoje
            </h3>

            <strong id="ganhoHoje">
                R$ 0,00
            </strong>

        </div>


        <div class="box">

            <h3>
                👩 Pessoas no mês
            </h3>

            <strong id="pessoasMes">
                0
            </strong>

        </div>


        <div class="box">

            <h3>
                💰 Ganho no mês
            </h3>

            <strong id="ganhoMes">
                R$ 0,00
            </strong>

        </div>


        <div class="box">

            <h3>
                👩 Total de pessoas
            </h3>

            <strong id="pessoasTotal">
                0
            </strong>

        </div>


        <div class="box">

            <h3>
                💰 Total ganho
            </h3>

            <strong id="ganhoTotal">
                R$ 0,00
            </strong>

        </div>

    </div>


    <!-- ==================================
         REGISTRAR DIA
    =================================== -->

    <div class="card">

        <h2>
            ➕ Registrar dia
        </h2>


        <form id="formRegistro">


            <div class="form-grid">


                <div>

                    <label for="data">
                        Data
                    </label>

                    <input
                        type="date"
                        id="data"
                        required
                    >

                </div>


                <div>

                    <label for="pessoas">
                        Quantidade de pessoas
                    </label>

                    <input
                        type="number"
                        id="pessoas"
                        min="0"
                        step="1"
                        placeholder="Ex: 5"
                        required
                    >

                </div>


                <div>

                    <label for="ganho">
                        Quanto ganhou
                    </label>

                    <input
                        type="number"
                        id="ganho"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 350,00"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                id="btnSalvar"
                class="btn-salvar"
            >
                💾 Salvar dia
            </button>


        </form>

    </div>


    <!-- ==================================
         HISTÓRICO
    =================================== -->

    <div class="card">

        <h2>
            📋 Histórico
        </h2>


        <div class="filtro">


            <div>

                <label for="filtroMes">
                    Ver mês
                </label>

                <input
                    type="month"
                    id="filtroMes"
                >

            </div>


            <button
                type="button"
                onclick="limparFiltro()"
            >
                🔄 Todos
            </button>


        </div>


        <div class="resumo-filtro">


            <div class="resumo-item">

                👩 Pessoas no período

                <strong id="pessoasFiltro">
                    0
                </strong>

            </div>


            <div class="resumo-item">

                💰 Ganho no período

                <strong id="ganhoFiltro">
                    R$ 0,00
                </strong>

            </div>

        </div>


        <div id="listaRegistros">

            <div class="carregando">
                Carregando...
            </div>

        </div>


    </div>


</div>


<script
    type="module"
    src="./admin.js"
></script>


</body>

</html>
